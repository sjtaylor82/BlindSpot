[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot-player"
version = "2026.7.0.7"
description = "A portable, keyboard-first Spotify client."
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "wxPython>=4.2.2",
    "accessible-output2>=0.17",
    "appscript>=1.2.5; sys_platform == 'darwin'",
    "certifi>=2025.7.14",
]

[project.scripts]
blindspot = "blindspot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
