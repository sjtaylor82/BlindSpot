name: Publish portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: BlindSpot-Windows
          - os: macos-14
            artifact: BlindSpot-macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Confirm tag matches application version
        shell: bash
        run: |
          version="$(python -c 'from pathlib import Path; import re; print(re.search(r"__version__ = \"([^\"]+)\"", Path("src/blindspot/__init__.py").read_text()).group(1))')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean BlindSpot.spec

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BlindSpot -DestinationPath dist/BlindSpot-Windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/BlindSpot-macOS
          ditto dist/BlindSpot.app dist/BlindSpot-macOS/BlindSpot.app
          cp prepare-macos.sh dist/BlindSpot-macOS/prepare-macos.sh
          chmod +x dist/BlindSpot-macOS/prepare-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/BlindSpot-macOS dist/BlindSpot-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes
